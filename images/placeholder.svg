<svg width="1216" height="811" viewBox="0 0 1216 811" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 그라데이션 배경 -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>

    <!-- 체커보드 패턴 -->
    <pattern id="checkerboard" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="#d1d5db" opacity="0.3"/>
      <rect x="20" y="20" width="20" height="20" fill="#d1d5db" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- 배경 -->
  <rect width="1216" height="811" fill="url(#backgroundGradient)"/>

  <!-- 체커보드 오버레이 -->
  <rect width="1216" height="811" fill="url(#checkerboard)" opacity="0.5"/>

  <!-- 중앙 아이콘 -->
  <g transform="translate(608, 405)">
    <!-- 이미지 아이콘 -->
    <g transform="translate(-60, -60)">
      <rect x="10" y="10" width="100" height="100" rx="8" stroke="#9ca3af" stroke-width="2" fill="none"/>
      <path d="M10 40L60 70L110 40" stroke="#9ca3af" stroke-width="2" fill="none"/>
      <circle cx="40" cy="30" r="8" fill="#9ca3af"/>
    </g>

    <!-- 텍스트 -->
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#9ca3af" text-anchor="middle">
      이미지 준비중
    </text>
  </g>
</svg>